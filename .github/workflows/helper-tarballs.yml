name: Helper tarballs

# fugue-helper-<backend>-x86_64-linux.tar.zst (cuda, vulkan, cpu) for the AppImage and every x86_64 distribution
# that has no fugue-helper package (docs/helper.md, issue #334). bin/package-helper builds each in an Ubuntu 22.04
# container on the hosted runner, so the glibc floor is the AppImage's (2.35); compiling CUDA needs no GPU.
# A v* tag adds the three files and their checksum files to the release package.yml makes; release-sums.yml then writes
# the SHA256SUMS that install.sh reads;
# a pull request that changes the script or this file builds them without uploading; by hand (workflow_dispatch)
# builds them and keeps them as workflow artifacts.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: [bin/package-helper, helper/fugue-helper.service, .github/workflows/helper-tarballs.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the ${{ matrix.backend }} tarball
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, vulkan, cpu]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1500M
      FUGUE_CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space (the CUDA image is 16 GB unpacked)
        if: matrix.backend == 'cuda'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Restore the compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: helper-tarball-${{ matrix.backend }}-${{ github.sha }}
          restore-keys: helper-tarball-${{ matrix.backend }}-

      - name: Build the tarball
        run: bin/package-helper --container ${{ matrix.backend }} dist

      - name: What is inside
        run: |
          ls -l dist
          cat dist/SHA256SUMS
          tar --zstd -tvf dist/fugue-helper-${{ matrix.backend }}-x86_64-linux.tar.zst

      - name: "Start it in a clean Ubuntu 22.04 (no GPU: the helper's own HTTP checks, which need no model)"
        # The CUDA helper needs the host's driver (libcuda.so.1) to start; its link check is in bin/package-helper.
        if: matrix.backend != 'cuda'
        run: |
          docker run --rm -v "$PWD:/w" -w /w ubuntu:22.04 bash -c '
            set -euo pipefail
            apt-get update -qq && apt-get install -y -qq --no-install-recommends curl zstd libvulkan1 python3 >/dev/null
            mkdir -p /root/.local/share/fugue/helper
            tar --zstd --strip-components=1 -xf dist/fugue-helper-${{ matrix.backend }}-x86_64-linux.tar.zst -C /root/.local/share/fugue/helper
            helper/smoke-http.sh /root/.local/share/fugue/helper/fugue-helper-${{ matrix.backend }}'

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: helper-${{ matrix.backend }}
          path: dist/*
          compression-level: 0 # already zstd

  release:
    name: Add them to the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: helper-*
          path: parts
      - name: Wait for the release, then add the tarballs and their checksum files
        # package.yml makes the release for the same tag. This only adds its own files: each tarball and its
        # <name>.sha256. Nothing here touches SHA256SUMS: release-sums.yml is its one writer (docs/release.md).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist && cp parts/*/*.tar.zst dist/
          for _ in $(seq 1 240); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then found=1; break; fi
            sleep 30
          done
          [[ ${found:-0} == 1 ]] || { echo "no release appeared in two hours (did package.yml fail?)"; exit 1; }
          cd dist
          for f in *.tar.zst; do sha256sum "$f" > "$f.sha256"; done
          cat ./*.sha256
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber ./*.tar.zst ./*.sha256

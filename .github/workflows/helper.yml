name: Helper

# stable-diffusion.cpp with Fugue's changes, from its fork (helper/). It takes long to build, so it runs
# only when the helper or its packaging changes, and keeps ccache's folder between runs.
# Only on a pull request that changes what it builds (docs excluded), or by hand: the merge itself is not rebuilt.
on:
  pull_request:
    paths: ['helper/**', '!helper/**/*.md', bin/build-helper, packaging/PKGBUILD, .github/workflows/helper.yml]
  workflow_dispatch:

# A new push to a pull request cancels that pull request's older run. Tags, the weekly runs and manual runs each get
# their own group (run_id), so a release is never cancelled. (llama.cpp's expression; docs/ci-research in the workbench.)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vulkan:
    name: Build the helper (Vulkan)
    runs-on: ubuntu-latest
    # The CUDA helper needs a multi-gigabyte toolkit and is built where it runs; Vulkan checks
    # the engine and the code.
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      # In a container job `github.workspace` is the host's path (/home/runner/work/...), not where the checkout is
      # mounted (/__w/...), so ccache would write outside the folder the cache steps restore and save (#335).
      - name: Point ccache at the cached folder
        run: echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"

      - name: Install git for the checkout
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v7

      - name: Check the PKGBUILD pins the helper's sources at the same commits
        run: bash tests/pins.sh

      - name: Install the helper's build dependencies
        run: pacman -S --noconfirm --needed base-devel ccache cmake shaderc spirv-headers vulkan-headers vulkan-icd-loader

      - name: Restore the compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: helper-vulkan-${{ hashFiles('helper/**') }}
          restore-keys: helper-vulkan-

      - name: Build
        run: bin/build-helper vulkan

      - name: Check the restore program with the engine's checker
        run: |
          cmake --build build-helper-vulkan --target fugue-helper-restore-test
          ctest --test-dir build-helper-vulkan --output-on-failure

      - name: Compiler cache use
        run: ccache -s

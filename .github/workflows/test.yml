name: Test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    # The app ships as an Arch package built against Arch's Qt, so it's tested there.
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    env:
      # bin/build uses ccache when it is installed; its folder is kept between runs below.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 800M
    steps:
      - name: Install git for the checkout
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v7
        with:
          submodules: true # the bundled templates: bmaltais/fugue-workflows, a public repo

      - name: Install the package's dependencies
        # The PKGBUILD in this repo is the one list of what the app needs, and CI reads it rather than keeping a copy.
        # Once the recipe is upstream in omarchy-pkgs, this can read pkgbuilds/<repo name>/PKGBUILD from there again.
        # cuda is left out: only the CUDA helper needs it, and the helper job builds the Vulkan one.
        run: |
          source packaging/PKGBUILD
          deps=("${depends[@]}" "${makedepends[@]}" "${checkdepends[@]}")
          wanted=()
          for dep in "${deps[@]%%[<>=]*}"; do [[ $dep == cuda ]] || wanted+=("$dep"); done
          pacman -S --noconfirm --needed base-devel ccache cmake dbus "${wanted[@]}"

      - name: Restore the compiler cache
        # A new entry is saved on every run (the key has the commit); the newest older one is the start.
        # It is restored before the chown below, so the build user owns it.
        uses: actions/cache@v6
        with:
          path: .ccache
          key: test-ccache-${{ github.sha }}
          restore-keys: test-ccache-

      - name: Set up a user and a locale like a desktop's
        # Root can read any file, so tests about unreadable ones need an ordinary user, with a second group for tests that change a file's group; and the container generates no locale.
        run: |
          useradd -m tester
          groupadd other
          usermod -aG other tester
          chown -R tester .
          sed -i 's/^#en_US.UTF-8/en_US.UTF-8/' /etc/locale.gen
          locale-gen

      - name: Build
        run: su tester -c bin/build

      - name: Test
        run: su tester -c 'LANG=en_US.UTF-8 dbus-run-session -- bin/test'

      - name: Compiler cache use
        if: always()
        run: su tester -c 'ccache -s'

  test-aarch64:
    name: Build and test (aarch64)
    # The same build and tests on an arm64 runner, so a pull request covers both architectures (#61).
    # Arch has no official arm64 container (Arch Linux ARM is a separate, third-party distribution), so
    # this uses Debian 13 (trixie): Qt 6.8 and libvips 8.16, near what the app is built against, where
    # Ubuntu 24.04 has Qt 6.4. See docs/aarch64-ci.md.
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 800M
    steps:
      - name: Install the build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential cmake pkg-config ccache \
            dbus jq locales fonts-noto-core libvips-dev libarchive-dev libvulkan-dev glslc spirv-headers \
            qt6-base-dev qt6-base-private-dev qt6-declarative-dev qt6-declarative-private-dev \
            qt6-shadertools-dev qt6-multimedia-dev qt6-wayland qt6-tools-dev qt6-tools-dev-tools \
            libgl-dev libxkbcommon-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-dialogs \
            qml6-module-qtqml qml6-module-qtqml-workerscript qml6-module-qtqml-models \
            qml6-module-qtquick-shapes qml6-module-qtmultimedia qml6-module-qttest

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Restore the compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: test-aarch64-ccache-${{ github.sha }}
          restore-keys: test-aarch64-ccache-

      - name: Set up a user and a locale like a desktop's
        run: |
          useradd -m tester
          groupadd other
          usermod -aG other tester
          chown -R tester .
          sed -i 's/^# *en_US.UTF-8/en_US.UTF-8/' /etc/locale.gen
          locale-gen

      - name: Build
        run: su tester -c bin/build

      - name: Test
        run: su tester -c 'LANG=en_US.UTF-8 dbus-run-session -- bin/test'

      - name: Compiler cache use
        if: always()
        run: su tester -c 'ccache -s'

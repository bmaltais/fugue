name: Test

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    # The app ships as an Arch package built against Arch's Qt, so it's tested there.
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    env:
      # bin/build uses ccache when it is installed; its folder is kept between runs below.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 800M
    steps:
      - name: Install git for the checkout
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4
        with:
          submodules: true # the bundled templates: bmaltais/fugue-workflows, a public repo

      - name: Install the package's dependencies
        # The PKGBUILD in this repo is the one list of what the app needs, and CI reads it rather than keeping a copy.
        # Once the recipe is upstream in omarchy-pkgs, this can read pkgbuilds/<repo name>/PKGBUILD from there again.
        # cuda is left out: only the CUDA helper needs it, and the helper job builds the Vulkan one.
        run: |
          source packaging/PKGBUILD
          deps=("${depends[@]}" "${makedepends[@]}" "${checkdepends[@]}")
          wanted=()
          for dep in "${deps[@]%%[<>=]*}"; do [[ $dep == cuda ]] || wanted+=("$dep"); done
          pacman -S --noconfirm --needed base-devel ccache cmake dbus "${wanted[@]}"

      - name: Restore the compiler cache
        # A new entry is saved on every run (the key has the commit); the newest older one is the start.
        # It is restored before the chown below, so the build user owns it.
        uses: actions/cache@v4
        with:
          path: .ccache
          key: test-ccache-${{ github.sha }}
          restore-keys: test-ccache-

      - name: Set up a user and a locale like a desktop's
        # Root can read any file, so tests about unreadable ones need an ordinary user, with a second group for tests that change a file's group; and the container generates no locale.
        run: |
          useradd -m tester
          groupadd other
          usermod -aG other tester
          chown -R tester .
          sed -i 's/^#en_US.UTF-8/en_US.UTF-8/' /etc/locale.gen
          locale-gen

      - name: Build
        run: su tester -c bin/build

      - name: Test
        run: su tester -c 'LANG=en_US.UTF-8 dbus-run-session -- bin/test'

      - name: Compiler cache use
        if: always()
        run: su tester -c 'ccache -s'

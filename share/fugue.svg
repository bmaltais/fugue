<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#1F2335"/>
  <!-- three voices of a fugue: wires that cross and join three nodes -->
  <g fill="none" stroke-linecap="round" stroke-width="3">
    <path d="M17 18 C 34 18, 30 32, 47 32" stroke="#FFD60A"/>
    <path d="M17 46 C 34 46, 30 32, 47 32" stroke="#7AA2F7"/>
    <path d="M17 32 C 30 32, 32 18, 47 18" stroke="#9ECE6A" opacity="0.9"/>
    <path d="M17 32 C 30 32, 32 46, 47 46" stroke="#F7768E" opacity="0.9"/>
  </g>
  <g fill="#1F2335" stroke-width="3">
    <circle cx="17" cy="18" r="5" stroke="#FFD60A"/>
    <circle cx="17" cy="32" r="5" stroke="#9ECE6A"/>
    <circle cx="17" cy="46" r="5" stroke="#7AA2F7"/>
    <circle cx="47" cy="18" r="5" stroke="#9ECE6A"/>
    <circle cx="47" cy="32" r="5" stroke="#FFD60A"/>
    <circle cx="47" cy="46" r="5" stroke="#F7768E"/>
  </g>
</svg>

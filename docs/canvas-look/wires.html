/* look-css:begin (src/look.css, inlined by derive.py --write) */
/* Shared mockup styles for docs/canvas-look/*.html; derive.py --write inlines this file.
   Every value here is the spec's (docs/canvas-look.md): t = 12 px text size, u = t / 3 = 4 px,
   r = the corner_radius setting (8 px unless set, #63). Colors come only from the generated [data-theme] tokens. */
:root {
  --t: 12px;
  --r: 8px;           /* node, frame and chip corner: the corner_radius setting */
  --R: 8px;           /* window-level surfaces (popups, overlay): the same setting */
  --font: "Liberation Sans", "Noto Sans", sans-serif; /* what Qt resolves sans-serif to here */
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--canvas);
  color: var(--text);
  font: 400 var(--t)/1.25 var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ---- canvas ---- */
.canvas {
  position: relative; width: 100%; height: 100%; overflow: hidden;
  background-color: var(--canvas);
  background-image:
    radial-gradient(circle at 1px 1px, var(--dot-major) 1.2px, transparent 1.4px),
    radial-gradient(circle at 1px 1px, var(--dot) 0.9px, transparent 1.1px);
  background-size: 120px 120px, 24px 24px;
}
.world { position: absolute; inset: 0; transform-origin: 0 0; }
svg.wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
svg.wires.over { z-index: 30; }

/* ---- frame, comment, reroute ---- */
.frame {
  position: absolute; border-radius: var(--r);
  background: var(--frame-muted); border: 1px solid var(--frame-muted-edge);
}
.frame .ftitle {
  position: absolute; left: 12px; top: 8px;
  font-size: 16px; font-weight: 600; letter-spacing: -0.005em; color: var(--frame-muted-title);
}
.frame.blue { background: var(--frame-blue); border-color: var(--frame-blue-edge); }
.frame.blue .ftitle { color: var(--frame-blue-title); }
.frame.green { background: var(--frame-green); border-color: var(--frame-green-edge); }
.frame.green .ftitle { color: var(--frame-green-title); }
.frame.magenta { background: var(--frame-magenta); border-color: var(--frame-magenta-edge); }
.frame.magenta .ftitle { color: var(--frame-magenta-title); }
.frame.sel { outline: 2px solid var(--accent); outline-offset: 2px; }
.comment {
  position: absolute; max-width: 232px; padding: 2px 0 2px 10px;
  border-left: 2px solid var(--hairline-strong); color: var(--label); font-size: 12px; line-height: 16px;
}
.reroute {
  position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
  box-shadow: 0 0 0 2px var(--canvas); z-index: 5;
}

/* ---- node ---- */
.node {
  position: absolute; width: 240px; z-index: 10;
  /* The fill and its sheen (#72): lighter at the top, lit more when hovered or selected. */
  --fill: var(--body); --sheen-a: var(--sheen-top); --sheen-b: var(--sheen-bottom);
  background: linear-gradient(var(--sheen-a), var(--sheen-b)), var(--fill);
  border: 1px solid var(--hairline); border-radius: var(--r);
  box-shadow: var(--shadow-1);
}
.node.hover { border-color: var(--hairline-strong); }
.node.sel { box-shadow: var(--shadow-2); outline: 2px solid var(--accent); outline-offset: 2px; z-index: 12; }
/* the resize mark (#63): 3 px inside the corner, concentric with it, on hover and selection.
   The app draws it in all four corners (the one under the pointer in --text); this draws one. */
.node.hover:not(.collapsed)::after, .node.sel:not(.collapsed)::after {
  content: ""; position: absolute; right: 3px; bottom: 3px; pointer-events: none;
  width: calc(max(0px, var(--r) - 3px) + max(3px, 9px - max(0px, var(--r) - 3px)));
  height: calc(max(0px, var(--r) - 3px) + max(3px, 9px - max(0px, var(--r) - 3px)));
  border: solid var(--label); border-width: 0 1.5px 1.5px 0; border-bottom-right-radius: max(0px, calc(var(--r) - 3px));
}
.node .hd {
  position: relative; height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 12px;
  background: var(--header); border-radius: calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0;
  box-shadow: inset 0 1px 0 var(--bevel);
}
.node.collapsed .hd { border-radius: calc(var(--r) - 1px); }
.node .kind { flex: none; width: 8px; height: 8px; }
.node .title {
  flex: 1; min-width: 0; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; letter-spacing: -0.005em;
}
.node .meta { flex: none; display: flex; align-items: center; gap: 4px; color: var(--label); font-size: 10px; }
.node .meta svg { width: 14px; height: 14px; }
.node .bd { position: relative; padding: 4px 0 8px; }
.node.collapsed .bd { display: none; }
.node.tint-blue .hd { background: var(--tint-blue); }
.node.tint-green .hd { background: var(--tint-green); }
.node.tint-magenta .hd { background: var(--tint-magenta); }
.node.tint-orange .hd { background: var(--tint-orange); }
/* A layout color tints the whole node, as in ComfyUI (#72): the body too. */
.node.tint-blue { --fill: var(--tint-body-blue); }
.node.tint-green { --fill: var(--tint-body-green); }
.node.tint-magenta { --fill: var(--tint-body-magenta); }
.node.tint-orange { --fill: var(--tint-body-orange); }
.node.hover, .node.sel { --sheen-a: var(--lit-top); --sheen-b: var(--lit-bottom); }
.progress { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--hairline); }
.progress i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* rows: 24 px; a port's mark is centered on the node's edge */
.row { position: relative; height: 24px; display: flex; align-items: center; padding: 0 12px; color: var(--label); font-size: 11px; }
.row.out { justify-content: flex-end; }
.row .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .val { margin-right: 8px; padding: 1px 6px; border-radius: min(var(--r), 4px); background: var(--well); color: var(--text); font-size: 10px; }
.port { position: absolute; top: 50%; width: 10px; height: 10px; margin-top: -5px; z-index: 2; }
.row.in .port { left: -6px; }
.row.out .port { right: -6px; }
.port i { position: absolute; inset: 0; display: block; }
.port.circle i, .port.ring i { border-radius: 50%; }
.port.square i { border-radius: min(var(--r), 2px); }
.port.diamond i { inset: 1px; transform: rotate(45deg); border-radius: min(var(--r), 1px); }
.port i { background: var(--c); box-shadow: 0 0 0 2px var(--body); }
.port.open i { background: var(--body); border: 2px solid var(--c); }
.port.ring i { background: var(--body); border: 2px solid var(--c); }
.port.list::before {
  content: ""; position: absolute; inset: 0; transform: translate(3px, -3px);
  border: 1.5px solid var(--c); border-radius: inherit; opacity: .7;
}
.port.list.circle::before { border-radius: 50%; }
/* an unwired widget input shows its mark only on hover or to a compatible dragged link */
.node:not(.hover):not(.target) .port.w { opacity: 0; }
.port.hot i { transform: scale(1.4); box-shadow: 0 0 0 2px var(--body), 0 0 0 4px var(--accent); }
.port.hot.diamond i { transform: rotate(45deg) scale(1.4); }
.dim { opacity: .25; }

/* widgets: a recessed field across the row, label left, value right */
.well {
  position: absolute; left: 12px; right: 12px; top: 2px; bottom: 2px; display: flex; align-items: center; gap: 6px;
  padding: 0 8px; background: var(--well); border-radius: min(var(--r), 4px); color: var(--label); overflow: hidden;
}
.well .v { margin-left: auto; color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.well svg { flex: none; width: 12px; height: 12px; color: var(--label); }
.well .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); opacity: .22; }
.well > * { position: relative; }
.row.multi { height: 64px; align-items: stretch; }
.row.multi .well { align-items: flex-start; padding: 6px 8px; color: var(--text); line-height: 16px; white-space: normal; }
.row.multi .port { top: 12px; }
.switch { margin-left: auto; width: 22px; height: 12px; border-radius: 6px; background: var(--accent); position: relative; }
.switch::after { content: ""; position: absolute; right: 2px; top: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-fg); }

/* the last value: thumbnail, 6 px inset, inner radius r - 6 */
.thumb {
  position: relative; margin: 4px 6px 0; aspect-ratio: 1 / 1; border-radius: max(0px, calc(var(--r) - 6px)); overflow: hidden;
  background: var(--well);
}
.thumb::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.10); }
[data-mode="light"] .thumb::after { box-shadow: inset 0 0 0 1px rgba(0,0,0,.10); }
.thumb .chip {
  position: absolute; left: 6px; bottom: 6px; padding: 2px 6px; border-radius: min(var(--r), 4px);
  background: rgba(0,0,0,.6); color: #fff; font-size: 10px; z-index: 1;
}
.thumb.wide { aspect-ratio: 16 / 9; }
.excerpt { margin: 2px 12px 0; padding: 6px 8px; background: var(--well); border-radius: min(var(--r), 4px); color: var(--label); font-size: 11px; line-height: 15px; }

/* states */
.node.running { border-color: var(--accent); }
.node.error { border-color: var(--error); }
.node.error .hd { background: var(--error-header); }
.node.error .meta { color: var(--error); }
/* Bypassed, as ComfyUI draws it in magenta: body and header tinted with the palette's magenta
   (the app steps the share down until the text reads at 4.5:1), a dashed edge in it. */
.node.bypassed { --fill: color-mix(in srgb, var(--body), var(--role-magenta) 22%); border-style: dashed;
  border-color: color-mix(in srgb, var(--canvas), var(--role-magenta) 85%); }
.node.bypassed .hd { background: color-mix(in srgb, var(--header), var(--role-magenta) 34%); }
.node.muted { opacity: .4; }
.node.skipped { opacity: .6; }
.node.missing { border: 1px dashed var(--error); }
.node.missing .title { color: var(--error); }
.node.frozen .meta { color: var(--text); }
.node.group::before {
  content: ""; position: absolute; inset: -1px; transform: translate(4px, 4px); z-index: -1;
  background: var(--body); border: 1px solid var(--hairline); border-radius: var(--r);
}
.errchip {
  position: absolute; left: -1px; right: -1px; top: calc(100% + 6px); display: flex; gap: 6px; padding: 6px 8px;
  background: var(--error-chip); border-left: 2px solid var(--error); border-radius: min(var(--r), 4px);
  color: var(--text); font-size: 11px; line-height: 15px;
}
.errchip svg { flex: none; width: 14px; height: 14px; color: var(--error); }
.passthrough { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

/* chips near the pointer (link reasons) */
.reason {
  position: absolute; z-index: 40; display: flex; align-items: center; gap: 6px; padding: 5px 9px 5px 7px;
  background: var(--popup); border: 1px solid var(--error); border-radius: min(var(--R), 6px);
  box-shadow: var(--shadow-3); font-size: 11px; white-space: nowrap;
}
.reason svg { width: 14px; height: 14px; color: var(--error); }
.reason b { font-weight: 600; }
.cursor { position: absolute; z-index: 41; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid var(--error); }

/* floating canvas furniture: level 3 surfaces */
.pill {
  position: absolute; z-index: 50; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px;
  background: var(--popup); border: 1px solid var(--hairline); border-radius: min(var(--R), 14px);
  box-shadow: var(--shadow-2); color: var(--label); font-size: 12px;
}
.pill b { color: var(--text); font-weight: 600; }
.pill .sep { color: var(--hairline-strong); }
.marquee { position: absolute; z-index: 35; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }

/* popups: search and the ? overlay */
.scrim { position: absolute; inset: 0; z-index: 60; background: var(--scrim); }
.popup {
  position: absolute; z-index: 70; background: var(--popup); border: 1px solid var(--hairline);
  border-radius: var(--R); box-shadow: var(--shadow-3); overflow: hidden;
}
kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px;
  border: 1px solid var(--hairline-strong); border-bottom-width: 2px; border-radius: min(var(--R), 4px);
  background: var(--body); color: var(--text); font: 500 11px/1 var(--font);
}
.mark { display: inline-block; width: 8px; height: 8px; background: var(--c); flex: none; }
.mark.circle { border-radius: 50%; }
.mark.square { border-radius: min(var(--r), 1.5px); }
.mark.diamond { width: 7px; height: 7px; transform: rotate(45deg); }
.mark.ring { border-radius: 50%; background: transparent; border: 1.5px solid var(--c); }
.mark.open { background: transparent; border: 1.5px solid var(--c); }

/* level of detail (zoom tiers, docs/canvas-look.md) */
.lod-map .row .lbl, .lod-map .well, .lod-map .title, .lod-map .meta, .lod-map .row .val, .lod-map .excerpt, .lod-map .thumb .chip { visibility: hidden; }
.lod-map .node { box-shadow: none; }
.lod-map .comment { visibility: hidden; }
.lod-overview .port, .lod-overview .row .lbl, .lod-overview .well, .lod-overview .title, .lod-overview .meta, .lod-overview .row .val, .lod-overview .excerpt, .lod-overview .thumb .chip { visibility: hidden; }
.lod-overview .node { box-shadow: none; }
.lod-overview .comment { visibility: hidden; }

/* board pages (states, search): labelled cells on the canvas */
.board { position: absolute; inset: 0; padding: 32px 40px; overflow: hidden; }
.cap { color: var(--label); font-size: 11px; font-weight: 600; margin-bottom: 10px; }
.h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
.sub { color: var(--label); font-size: 12px; margin: 0 0 22px; }
.switcher {
  position: fixed; right: 12px; bottom: 12px; z-index: 100; display: flex; gap: 6px; padding: 6px;
  background: var(--popup); border: 1px solid var(--hairline); border-radius: 8px; box-shadow: var(--shadow-2);
}
.switcher select { font: inherit; color: var(--text); background: var(--body); border: 1px solid var(--hairline); border-radius: 4px; padding: 2px 4px; }
.shot .switcher { display: none; }

/* motion (browser only; the screenshots are static) */
@media (prefers-reduced-motion: no-preference) {
  .node.running { animation: pulse 1600ms ease-in-out infinite alternate; }
  .spin { animation: spin 900ms linear infinite; transform-origin: 50% 50%; }
}
@keyframes pulse { from { border-color: var(--accent); } to { border-color: color-mix(in srgb, var(--accent) 45%, var(--body)); } }
@keyframes spin { to { transform: rotate(360deg); } }

/* Map and overview tiers: frame titles keep a constant on-screen size and sit above nodes. */
.lod-map .frame .ftitle, .lod-overview .frame .ftitle { z-index: 20; padding: 0 0.2em; background: inherit; }
.lod-map .frame.blue .ftitle, .lod-overview .frame.blue .ftitle { background: var(--frame-blue); }
/* look-css:end */
.label { position: absolute; color: var(--label); font-size: 11px; }
.label b { color: var(--text); font-weight: 600; font-size: 12px; }
.panel { position: absolute; overflow: hidden; border: 1px solid var(--hairline); border-radius: var(--r); }
.panel > .canvas { position: absolute; inset: 0; }
.handle { position: absolute; z-index: 31; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--popup); border: 1px solid var(--hairline-strong); color: var(--text); box-shadow: var(--shadow-2); }
.handle svg { width: 10px; height: 10px; }
</style>

<body>
<div class="canvas"><div class="world" id="world"></div></div>
<script>
// look-js:begin (src/look.js, inlined by derive.py --write)
// Shared mockup code for docs/canvas-look/*.html; derive.py --write inlines this file.
// Builds nodes and wires from plain data with the spec's geometry, so the pages stay short.
// URL hash: #theme=ethereal&r=8&shot (shot hides the switcher for screenshots).
const LOOK = (() => {
  const THEMES = ["ethereal", "tokyo-night", "rose-pine", "flexoki-light", "white"];
  const LIGHT = { "rose-pine": 1, "flexoki-light": 1, white: 1 };
  const SHAPE = { text: "circle", number: "circle", boolean: "circle", image: "square", video: "square",
                  audio: "square", any: "ring" };
  const shapeOf = (type) => SHAPE[type] || "diamond";
  const colorOf = (type) => type === "any" ? "var(--label)" :
    `var(--port-${["text", "number", "boolean", "image", "video", "audio"].includes(type) ? type : "declared"})`;

  // Lucide-style glyphs (ISC); the app bundles them as an icon font (docs/canvas-look.md, "Glyphs").
  const P = {
    check: '<path d="M20 6 9 17l-5-5"/>',
    stale: '<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>',
    spinner: '<path d="M21 12a9 9 0 1 1-6.2-8.6"/>',
    frozen: '<path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7"/><path d="m9 4 3 2 3-2M9 20l3-2 3 2"/>',
    error: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
    bypass: '<path d="M4 4v7a4 4 0 0 0 4 4h12"/><path d="m15 10 5 5-5 5"/>',
    mute: '<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>',
    skip: '<path d="M5 4l10 8-10 8z"/><path d="M19 5v14"/>',
    pin: '<path d="M12 17v5"/><path d="M9 10.8a2 2 0 0 1-1.1 1.8l-1.8.9A2 2 0 0 0 5 15.2V17h14v-1.8a2 2 0 0 0-1.1-1.8l-1.8-.9A2 2 0 0 1 15 10.8V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/>',
    group: '<path d="M12 2 2 7l10 5 10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>',
    missing: '<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>',
    seed: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 8h.01M16 8h.01M12 12h.01M8 16h.01M16 16h.01"/>',
    choice: '<path d="m6 9 6 6 6-6"/>',
    folder: '<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/>',
    model: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    reason: '<circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/>',
    warn: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
    color: '<circle cx="12" cy="12" r="9"/>',
  };
  const icon = (name, cls = "") =>
    `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[name]}</svg>`;

  // A stand-in for a generated image: a fox in a misty birch wood at dawn, in CSS.
  const scene = (variant = "") => `<div class="scene ${variant}" style="position:absolute;inset:0;background:
      radial-gradient(ellipse 15% 9% at 57% 77%, #d9652b 0 62%, transparent 66%),
      radial-gradient(ellipse 5% 7% at 66% 70%, #e2733a 0 60%, transparent 64%),
      radial-gradient(ellipse 9% 3% at 46% 80%, #c95a24 0 60%, transparent 64%),
      linear-gradient(to top, rgba(232,226,214,.85), rgba(232,226,214,0) 38%),
      linear-gradient(90deg, transparent 12%, rgba(240,236,228,.9) 12% 13.4%, transparent 13.4% 26%,
        rgba(240,236,228,.55) 26% 27%, transparent 27% 79%, rgba(240,236,228,.95) 79% 81%, transparent 81% 90%,
        rgba(240,236,228,.5) 90% 90.8%, transparent 90.8%),
      radial-gradient(circle at 70% 26%, rgba(255,236,200,1) 0 5%, rgba(255,206,160,.6) 13%, transparent 42%),
      linear-gradient(#f2c49e, #b9c3b4 48%, #5e776a);"></div>`;

  function port(row) {
    const sh = shapeOf(row.type);
    const open = row.connected === false && sh !== "ring" ? " open" : "";
    const w = row.widget && row.connected === false ? " w" : "";
    return `<span class="port ${sh}${open}${w}${row.list ? " list" : ""}${row.hot ? " hot" : ""}" data-port="${row.dir}:${row.name}" style="--c:${colorOf(row.type)}"><i></i></span>`;
  }

  function widget(w, label) {
    const v = w.value;
    switch (w.kind) {
      case "spin": return `<div class="well"><span>${label}</span><span class="v">${v}</span></div>`;
      case "slider": return `<div class="well"><span class="fill" style="width:${w.at * 100}%"></span><span>${label}</span><span class="v">${v}</span></div>`;
      case "seed": return `<div class="well"><span>${label}</span><span class="v">${v}</span>${icon("seed")}</div>`;
      case "choice": return `<div class="well"><span>${label}</span><span class="v">${v}</span>${icon("choice")}</div>`;
      case "file": return `<div class="well"><span>${label}</span><span class="v">${v}</span>${icon("folder")}</div>`;
      case "model": return `<div class="well">${icon("model")}<span class="v" style="margin-left:0">${v}</span>${icon("choice")}</div>`;
      case "toggle": return `<div class="well"><span>${label}</span><span class="switch"></span></div>`;
      case "line": return `<div class="well"><span>${label}</span><span class="v">${v}</span></div>`;
      case "color": return `<div class="well"><span>${label}</span><span class="v">${v}</span><span style="width:12px;height:12px;border-radius:2px;background:${w.swatch}"></span></div>`;
      case "multiline": return `<div class="well">${v}</div>`;
    }
    return "";
  }

  function node(n) {
    const el = document.createElement("div");
    el.className = "node " + (n.cls || "");
    el.id = n.id;
    el.style.left = n.x + "px";
    el.style.top = n.y + "px";
    if (n.w) el.style.width = n.w + "px";
    const k = n.kind ? `<span class="mark kind ${shapeOf(n.kind)}" style="--c:${colorOf(n.kind)}"></span>` :
      n.group ? `<span style="width:14px;height:14px;color:var(--label);display:flex">${icon("group")}</span>` : "";
    const meta = n.meta ? `<span class="meta">${n.meta.text ? `<span>${n.meta.text}</span>` : ""}${n.meta.icons ? n.meta.icons.map(i => icon(i, i === "spinner" ? "spin" : "")).join("") : ""}</span>` : "";
    let rows = "";
    for (const r of n.rows || []) {
      if (r.dir === "out") {
        rows += `<div class="row out">${r.value ? `<span class="val">${r.value}</span>` : ""}<span class="lbl">${r.name}</span>${port(r)}</div>`;
      } else {
        const multi = r.widget && r.widget.kind === "multiline" ? " multi" : "";
        const shown = r.widget && !r.connected ? widget(r.widget, r.name) : `<span class="lbl">${r.name}</span>`;
        rows += `<div class="row in${multi}">${port(r)}${shown}</div>`;
      }
    }
    const thumb = n.thumb ? `<div class="thumb ${n.thumb.wide ? "wide" : ""}">${scene()}${n.thumb.chip ? `<span class="chip">${n.thumb.chip}</span>` : ""}</div>` : "";
    const excerpt = n.excerpt ? `<div class="excerpt">${n.excerpt}</div>` : "";
    const progress = n.progress !== undefined ? `<span class="progress"><i style="width:${n.progress * 100}%"></i></span>` : "";
    const err = n.errchip ? `<div class="errchip">${icon("error")}<span>${n.errchip}</span></div>` : "";
    el.innerHTML = `<div class="hd">${k}<span class="title">${n.title}</span>${meta}${progress}</div>` +
      `<div class="bd">${rows}${thumb}${excerpt}${n.foot ? `<div class="row" style="height:20px;font-size:10px">${n.foot}</div>` : ""}</div>${err}`;
    return el;
  }

  // Port center in world coordinates.
  function portPos(world, nodeId, key) {
    const p = world.querySelector(`#${nodeId} [data-port="${key}"]`);
    const wr = world.getBoundingClientRect(), pr = p.getBoundingClientRect();
    const s = world._scale || 1;
    return { x: (pr.left + pr.width / 2 - wr.left) / s, y: (pr.top + pr.height / 2 - wr.top) / s };
  }
  // Cubic with horizontal tangents (docs/canvas-look.md, "Wires").
  function curve(a, b) {
    const ddx = b.x - a.x;
    const dx = ddx >= 24 ? Math.min(Math.max(ddx * 0.5, 24), 160) : 48 + Math.min(Math.abs(ddx), 400) * 0.25;
    return `M${a.x},${a.y} C${a.x + dx},${a.y} ${b.x - dx},${b.y} ${b.x},${b.y}`;
  }
  const NS = "http://www.w3.org/2000/svg";
  function path(svg, d, attrs) {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    p.setAttribute("fill", "none");
    for (const [k, v] of Object.entries(attrs)) p.setAttribute(k, v);
    svg.appendChild(p);
    return p;
  }
  // state: rest | hi (attached to the selection, or hovered) | dim | run | drag | invalid
  function wire(svg, a, b, type, state = "rest", via) {
    const color = colorOf(type);
    const pts = via ? [a, via, b] : [a, b];
    for (let i = 0; i + 1 < pts.length; i++) {
      const d = curve(pts[i], pts[i + 1]);
      if (state === "hi" || state === "drag" || state === "run")
        path(svg, d, { stroke: "var(--canvas)", "stroke-width": 6, "stroke-linecap": "round" });
      const attrs = { stroke: color, "stroke-width": state === "hi" || state === "drag" ? 2.5 : 2, "stroke-linecap": "round",
                      opacity: state === "dim" ? 0.25 : state === "rest" ? 0.8 : 1 };
      if (state === "invalid") Object.assign(attrs, { stroke: "var(--error)", "stroke-dasharray": "6 5", "stroke-width": 2.5 });
      const p = path(svg, d, attrs);
      if (state === "run") {

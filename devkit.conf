# shellcheck shell=bash disable=SC2034
# Records the README's animated tours (docs/recording-screenshots.md) with the omarchy-plugin-devkit
# (scripts/devkit): Fugue runs in a headless sway, with a sandbox home, so nothing is drawn on
# the desktop and the real pointer never moves.
DEVKIT_NAME=fugue
TOUR_TITLE=Fugue
DEVKIT_BACKEND=headless
# FUGUE_BIN picks the binary (default: this checkout's build/fugue from `nice bin/build`). Its bundled templates sit
# beside it (build/templates) and the helper in the build-helper-* folders next to the build folder.
DEVKIT_APP_CMD=("${FUGUE_BIN:-build/fugue}")
DEVKIT_APP_CLASS='^fugue$'
# The sandbox home is empty; its settings are a copy of the real ones so the models are found
# where they are (/mnt/windows/models, read in place and never written).
TOUR_SANDBOX_COPY=(.config/fugue/settings.json)
# What a recording must never change: the owner's real Fugue data. (Not .cache/fugue: a Fugue the owner has running rewrites its QML cache by itself.)
TOUR_REAL_UNCHANGED=(.config/fugue .local/share/fugue Documents)
